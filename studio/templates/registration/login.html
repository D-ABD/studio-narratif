<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B0E14">
  <title>Connexion · Petit Studio</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#0B0E14; color:#F2F4F8; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; }
    main { width:min(100%,440px); padding:32px; border:1px solid #29313E; border-radius:18px; background:#151A22; box-shadow:0 22px 60px #0005; }
    .mark { color:#F59E0B; font-size:12px; font-weight:800; letter-spacing:1.5px; }
    h1 { margin:8px 0; font-size:26px; }
    p { color:#929BAA; font-size:13px; }
    form p { display:grid; gap:6px; margin:18px 0; }
    label { color:#C3CAD5; font-size:12px; }
    input { width:100%; padding:11px 12px; border:1px solid #394352; border-radius:9px; color:#F2F4F8; background:#0F141C; }
    button { width:100%; margin-top:12px; padding:12px; border:0; border-radius:9px; color:#17130A; background:#F59E0B; font-weight:750; cursor:pointer; }
    a { color:#FFC65D; }
    .errorlist { color:#F07D77; font-size:12px; }
    .links { margin-top:20px; text-align:center; font-size:13px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">✦ PETIT STUDIO</div>
    <h1>Connexion</h1>
    <p>Connecte-toi pour retrouver tes projets et tes voix.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button type="submit">Se connecter</button>
    </form>
    <div class="links"><a href="{% url 'register' %}">Créer un compte</a></div>
  </main>
</body>
</html>
