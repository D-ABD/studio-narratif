{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B0E14">
  <title>{% block title %}Petit Studio{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'studio/app.css' %}?v=6">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0B0E14;
      --sidebar: #10141C;
      --panel: #151A22;
      --panel-2: #1B222D;
      --line: #29313E;
      --muted: #929BAA;
      --text: #F2F4F8;
      --orange: #F59E0B;
      --orange-deep: #D97706;
      --green: #78C89A;
      --red: #F07D77;
      --radius: 16px;
      --shadow: 0 22px 60px #0005;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font: inherit; }
    .app-shell {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
      transition: grid-template-columns 0.3s ease;
    }
    .sidebar.premium-sidebar {
      position: sticky;
      top: 0;
      width: 280px;
      height: 100vh;
      min-height: 560px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 24px 16px 18px;
      background: var(--sidebar);
      border-right: 1px solid #222936;
      transition: width 0.3s ease, padding 0.3s ease;
      z-index: 5;
    }
    .premium-brand-row {
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 7px;
      margin-bottom: 35px;
      white-space: nowrap;
    }
    .premium-brand-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      flex: 0 0 40px;
      border-radius: 13px;
      background: var(--orange);
      color: #17130A;
      font-size: 21px;
      font-weight: 900;
      box-shadow: 0 7px 24px #F59E0B30;
    }
    .premium-wordmark { font-size: 17px; line-height: 1.1; font-weight: 780; letter-spacing: -.55px; }
    .premium-wordmark small {
      display: block;
      margin-top: 5px;
      color: #778193;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.55px;
    }
    .premium-toggle {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      margin-left: auto;
      border: 1px solid #2C3543;
      border-radius: 10px;
      background: #171D27;
      color: #AEB7C5;
      cursor: pointer;
      transition: background .18s, color .18s, transform .3s;
    }
    .premium-toggle:hover { background: #242D3A; color: #fff; }
    .premium-toggle svg { width: 17px; height: 17px; }
    .premium-section-title {
      padding: 0 10px 10px;
      color: #758092;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.45px;
      white-space: nowrap;
      transition: opacity .18s;
    }
    .premium-nav { display: grid; gap: 5px; margin-bottom: 30px; }
    .premium-create-form { margin: 0; }
    .premium-create-button { width: 100%; border-color: #3A321F; color: #FFD178; background: #201A11; text-align: left; cursor: pointer; }
    .premium-create-button:hover { border-color: #805514;
