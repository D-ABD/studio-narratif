{% extends "studio/base.html" %}
{% block title %}File d'attente · Petit Studio{% endblock %}
{% block heading %}File d'attente{% endblock %}
{% block content %}
<style>
  .queue-page { max-width: 1200px; margin: 0 auto; }
  .queue-intro { margin: -8px 0 22px; color: #929BAA; font-size: 12px; }
  .queue-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; align-items: start; }
  .queue-section { min-width: 0; padding: 19px; border: 1px solid #29313E; border-radius: 16px; background: #151A22; box-shadow: 0 22px 60px #0003; }
  .queue-section h2 { margin: 0 0 14px; color: #E7EAF0; font-size: 12px; letter-spacing: .5px; }
  .queue-list { display: grid; gap: 9px; }
  .queue-row { min-width: 0; padding: 13px; border: 1px solid #2B3441; border-radius: 12px; background: #11161F; }
  .queue-row-main { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .queue-project-link { min-width: 0; overflow: hidden; color: #F2F4F8; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
  .queue-project-link:hover { color: #FFC65D; }
  .queue-row-status { flex: 0 0 auto; color: #F6BD73; font-size: 9px; }
  .queue-row.is-queued .queue-row-status { color: #AAB3C1; }
  .queue-row progress { display: block; width: 100%; height: 7px; margin: 12px 0 5px; accent-color: #F59E0B; }
  .queue-row-details { display: flex; justify-content: space-between; gap: 10px; color: #929BAA; font-size: 10px; }
  .queue-row-actions { display: flex; justify-content: flex-end; margin-top: 11px; }
  .queue-row-panel { margin-top:10px; padding-top:10px; border-top:1px solid #29313E; }
  .queue-row-panel a { color:#FFC65D; }
  .queue-row-summary { min-height:30px; padding:0; color:#F2F4F8; }
  .queue-row-summary .queue-project-link { color:#F2F4F8; }
  .queue-row-summary-progress { flex:0 0 auto; color:#F6BD73; font-size:10px; }
  .queue-history-item { display:block; padding:0; }
  .queue-history-summary { min-height:40px; padding:9px 12px; }
  .queue-history-panel { padding:0 12px 10px; border-top:1px solid #29313E; }
  .queue-history-panel p { margin:7px 0 0; }
  .queue-history-panel .queue-history-error { color:#F0AAA3; }
  .queue-cancel-button { min-height: 31px; padding: 0 10px; border: 1px solid #603337; border-radius: 8px; color: #F0AAA3; background: #2A1B1B; font-size: 10px; font-weight: 700; cursor: pointer; }
  .queue-cancel-button:disabled { opacity: .55; cursor: not-allowed; }
  .queue-empty { padding: 28px 16px; border: 1px dashed #35404F; border-radius: 12px; color: #AAB3C1; text-align: center; }
  .queue-empty strong { display: block; margin-bottom: 4px; color: #E7EAF0; font-size: 13px; }
  .queue-subempty { color: #778294; font-size: 10px; text-align: center; }
  .queue-refresh-note { margin: 12px 2px 0; color: #778294; font-size: 9px; text-align: right; }
  .queue-history { margin-top: 16px; padding: 19px; border: 1px solid #29313E; border-radius: 16px; background: #151A22; }
  .queue-history-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .queue-history-heading h2 { margin:0; color:#E7EAF0; font-size:12px; letter-spacing:.5px; }
  .queue-history-list { display:grid; gap:7px; margin:0; padding:0; list-style:none; }
  .queue-history-item { display:flex; justify-content:space-between; gap:12px; padding:10px 12px; border:1px solid #2B3441; border-radius:9px; color:#AAB3C1; background:#11161F; font-size:10px; }
