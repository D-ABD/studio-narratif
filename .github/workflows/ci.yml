name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check --fail-level WARNING
        env: &django-env
          SECRET_KEY: "test-secret-key-for-ci-not-a-real-one"
          DEBUG: "False"
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          DJANGO_SECRET_KEY: "test-secret-key-for-ci-not-a-real-one"
          DJANGO_DEBUG: "0"

      - name: Vérifier qu'aucune migration ne manque
        run: python manage.py makemigrations --check --dry-run
        env: *django-env

      - name: Run tests
        run: python manage.py test --noinput --verbosity=2
        env: *django-env
